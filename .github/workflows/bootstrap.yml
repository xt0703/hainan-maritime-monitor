name: Bootstrap Hainan Maritime Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand starter project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'hainan-maritime-monitor-starter*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Không tìm thấy hainan-maritime-monitor-starter.zip ở thư mục gốc repo."
            exit 1
          fi

          rm -rf /tmp/hainan-bootstrap
          mkdir -p /tmp/hainan-bootstrap
          unzip -q -o "$ZIP" -d /tmp/hainan-bootstrap

          test -d /tmp/hainan-bootstrap/hainan-maritime-monitor
          cp -a /tmp/hainan-bootstrap/hainan-maritime-monitor/. .

          rm -f "$ZIP"
          rm -f .github/workflows/bootstrap.yml

      - name: Commit project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hainan-monitor-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi cần commit."
            exit 0
          fi
          git commit -m "bootstrap: install Hainan maritime monitor"
          git push
